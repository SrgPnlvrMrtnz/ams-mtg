<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Arena - Ultimate Tracker</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* Panel de configuración */
        .setup-panel {
            background: var(--bg-panel);
            padding: 25px;
            margin: 20px auto;
            max-width: 950px;
            border-radius: 15px;
            border: 1px solid #333;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
        }

        .setup-panel input[type="text"] {
            width: 180px; font-size: 1rem; border: 2px solid #444;
            background: #222; color: white; padding: 10px; border-radius: 6px;
        }

        .partida-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px; padding: 20px; max-width: 1400px; margin: 0 auto;
        }

        .btn-remove-player {
            position: absolute; top: 15px; right: 15px;
            background: rgba(220, 53, 69, 0.2); color: var(--danger);
            width: 30px; height: 30px; padding: 0; border-radius: 50%;
            font-size: 14px; border: 1px solid var(--danger);
            transition: 0.3s; cursor: pointer; z-index: 10;
        }

        .jugador-card {
            position: relative; background-size: cover !important;
            background-position: center 20% !important; overflow: hidden;
            z-index: 1; transition: border 0.3s, box-shadow 0.3s;
        }

        .jugador-card.has-monarch { border: 3px solid var(--gold) !important; box-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }

        .jugador-card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(20,20,20,0.95) 85%);
            z-index: -1;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.2s ease-in-out; }

        /* --- LOG DE COMBATE --- */
        #log-container {
            position: fixed; right: -320px; top: 0; width: 300px; height: 100%;
            background: rgba(15, 15, 15, 0.98); border-left: 2px solid var(--primary);
            z-index: 20000; transition: 0.4s ease; padding: 20px;
            box-shadow: -5px 0 20px rgba(0,0,0,0.8); overflow-y: auto;
        }
        #log-container.open { right: 0; }
        .log-entry { font-size: 0.85rem; padding: 10px 0; border-bottom: 1px solid #222; color: #ddd; font-family: monospace; }
        .log-entry b { color: var(--gold); }
        .btn-log-toggle {
            position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px;
            background: var(--primary); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 28px;
            cursor: pointer; z-index: 20001; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* --- ANIMACIONES DADOS Y MONEDA --- */
        .overlay-stage {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); z-index: 30000; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        .visual-object { width: 160px; height: 160px; position: relative; transform-style: preserve-3d; display: flex; align-items: center; justify-content: center; }
        .coin div { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.8rem; border: 8px solid #b8860b; }
        .coin-front { background: linear-gradient(135deg, #ffd700, #b8860b); color: #444; }
        .coin-back { background: linear-gradient(135deg, #b8860b, #ffd700); color: #444; transform: rotateY(180deg); }
        .dice { background: #5533ff; color: white; border-radius: 20px; border: 4px solid #fff; font-size: 4rem; font-weight: bold; box-shadow: 0 0 30px #5533ff; }
        @keyframes spinObject { 0% { transform: rotateX(0deg) rotateY(0deg); } 100% { transform: rotateX(1440deg) rotateY(1440deg); } }
        .spinning { animation: spinObject 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards; }
        
        .tax-badge { background: #d63384; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; cursor: pointer; margin-left: 5px; font-weight: bold; }
        .extra-trackers { display: flex; justify-content: center; margin: 10px 0; padding: 8px; background: rgba(0,0,0,0.4); border-radius: 8px; }
        .veneno-btn { background: #222; border: 1px solid #444; color: white; border-radius: 4px; width: 28px; height: 28px; cursor: pointer; margin: 0 10px; }
        
        /* Monarca Original */
        .btn-monarch {
            background: rgba(0,0,0,0.5); border: 1px solid var(--gold); color: var(--gold);
            font-size: 0.65rem; padding: 4px 8px; border-radius: 4px; cursor: pointer;
        }
        .btn-monarch.active { background: var(--gold); color: black; font-weight: bold; }

        .commander-section { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #444; }
        .commander-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); margin-bottom: 4px; padding: 4px 8px; border-radius: 6px; }

        #search-results-comm { position: absolute; background: #222; border: 1px solid #444; width: 100%; max-height: 200px; overflow-y: auto; z-index: 100; border-radius: 6px; top: 45px; }
        .search-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #333; font-size: 0.9rem; color: white; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <h1>MTG BATTLE ARENA</h1>
            <div style="display: flex; gap: 10px;">
                <button onclick="lanzarDadoAnimado()" style="background: #5533ff;">🎲 D20</button>
                <button onclick="lanzarMonedaAnimada()" style="background: #ffaa00;">🪙 MONEDA</button>
                <button onclick="window.location.href='index.html'" style="background: #444;">🔙 BUSCADOR</button>
                <button onclick="reiniciarPartida()" style="background: var(--green);">🔄 REINICIAR</button>
                <button onclick="borrarTodo()" style="background: #666;">🗑️ LIMPIAR</button>
            </div>
        </div>
    </header>

    <div id="overlay-stage" class="overlay-stage" onclick="this.style.display='none'">
        <div id="visual-content" class="visual-object"></div>
    </div>

    <div id="log-container">
        <h2 style="color: var(--primary); font-size: 1.1rem; border-bottom: 2px solid #333; padding-bottom: 10px;">HISTORIAL</h2>
        <div id="log-list"></div>
    </div>
    <div class="btn-log-toggle" onclick="document.getElementById('log-container').classList.toggle('open')">📜</div>

    <div class="setup-panel">
        <input type="text" id="nombreJugador" placeholder="Nombre Jugador...">
        <div style="position:relative;">
            <input type="text" id="nombreComandante" placeholder="Comandante..." oninput="buscarCarta(this.value)">
            <div id="search-results-comm" class="hidden"></div>
        </div>
        <select id="vidasIniciales" style="padding: 10px; background: #222; color: white; border-radius: 6px;">
            <option value="40" selected>40 Vidas</option>
            <option value="20">20 Vidas</option>
        </select>
        <button onclick="agregarJugador()" style="background: var(--primary); font-weight: bold;">➕ AÑADIR</button>
    </div>

    <div class="partida-container" id="arena"></div>

    <script>
        let jugadores = JSON.parse(localStorage.getItem('mtg_players')) || [];
        let logPartida = [];
        let intervaloVida;
        let vidaAlEmpezar = 0; 
        let cambiandoVida = false; 
        let comandanteSeleccionado = { name: "", art: "" };

        function addLog(msg) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            logPartida.unshift(`[${time}] ${msg}`);
            if(logPartida.length > 50) logPartida.pop();
            renderLog();
        }

        function renderLog() {
            document.getElementById('log-list').innerHTML = logPartida.map(e => `<div class="log-entry">${e}</div>`).join('');
        }

        async function buscarCarta(query) {
            const resultsDiv = document.getElementById('search-results-comm');
            if (query.length < 2) { resultsDiv.classList.add('hidden'); return; }
            try {
                const response = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(query)}+is%3Acommander`);
                const data = await response.json();
                if (data.data) {
                    resultsDiv.innerHTML = ""; resultsDiv.classList.remove('hidden');
                    data.data.slice(0, 8).forEach(card => {
                        const div = document.createElement('div');
                        div.className = 'search-item'; div.innerText = card.name;
                        div.onclick = () => {
                            comandanteSeleccionado = { 
                                name: card.name, 
                                art: card.image_uris ? card.image_uris.art_crop : (card.card_faces ? card.card_faces[0].image_uris.art_crop : "") 
                            };
                            document.getElementById('nombreComandante').value = card.name;
                            resultsDiv.classList.add('hidden');
                        };
                        resultsDiv.appendChild(div);
                    });
                }
            } catch (e) { console.error(e); }
        }

        function lanzarMonedaAnimada() {
            const stage = document.getElementById('overlay-stage');
            const content = document.getElementById('visual-content');
            const esCruz = Math.random() < 0.5;
            content.className = "visual-object coin";
            content.innerHTML = `<div class="coin-front">CARA</div><div class="coin-back">CRUZ</div>`;
            stage.style.display = 'flex'; content.classList.remove('spinning'); void content.offsetWidth; content.classList.add('spinning');
            setTimeout(() => {
                content.classList.remove('spinning');
                content.style.transform = esCruz ? 'rotateY(1980deg)' : 'rotateY(1800deg)';
                addLog(`🪙 Moneda: <b>${esCruz ? 'CRUZ' : 'CARA'}</b>`);
                setTimeout(() => { stage.style.display = 'none'; }, 1800);
            }, 1200);
        }

        function lanzarDadoAnimado() {
            const stage = document.getElementById('overlay-stage');
            const content = document.getElementById('visual-content');
            const resultado = Math.floor(Math.random() * 20) + 1;
            content.className = "visual-object dice"; content.innerHTML = `?`;
            stage.style.display = 'flex'; content.classList.remove('spinning'); void content.offsetWidth; content.classList.add('spinning');
            setTimeout(() => {
                content.classList.remove('spinning'); content.innerHTML = resultado;
                content.style.transform = 'rotateX(0deg) rotateY(0deg)';
                addLog(`🎲 D20: sacó un <b>${resultado}</b>`);
                setTimeout(() => { stage.style.display = 'none'; }, 2000);
            }, 1200);
        }

        function agregarJugador() {
            const nom = document.getElementById('nombreJugador').value.trim();
            const vIni = parseInt(document.getElementById('vidasIniciales').value);
            if (!nom) return;
            const nuevo = {
                id: Date.now(), nombre: nom, comandante: comandanteSeleccionado.name || "Sin Comandante",
                foto: comandanteSeleccionado.art || "", vida: vIni,
                veneno: 0, monarca: false, tax: 0, eliminado: false, cmdDmg: {}
            };
            jugadores.push(nuevo);
            addLog(`👤 <b>${nom}</b> se une con ${vIni} vidas.`);
            document.getElementById('nombreJugador').value = ""; document.getElementById('nombreComandante').value = "";
            comandanteSeleccionado = { name: "", art: "" }; guardar(); renderizarArena();
        }

        function ejecutarCambio(id, cantidad) {
            const j = jugadores.find(x => x.id === id);
            if (!j || j.eliminado) return;
            j.vida += cantidad;
            if (cantidad < 0) animarDanyo(id);
            if (j.vida <= 0) { j.vida = 0; j.eliminado = true; }
            actualizarInterfazVida(id);
        }

        function iniciarCambio(id, cantidad) {
            if (cambiandoVida) return;
            const j = jugadores.find(x => x.id === id);
            vidaAlEmpezar = j.vida;
            cambiandoVida = true;
            ejecutarCambio(id, cantidad);
            intervaloVida = setTimeout(() => {
                intervaloVida = setInterval(() => ejecutarCambio(id, cantidad), 100);
            }, 450);
        }

        function detenerCambio(id) { 
            if (!cambiandoVida) return;
            clearInterval(intervaloVida); clearTimeout(intervaloVida);
            intervaloVida = null;
            cambiandoVida = false;
            
            const j = jugadores.find(x => x.id === id);
            if (!j) return;
            
            const diferencia = j.vida - vidaAlEmpezar;
            if (diferencia !== 0) {
                addLog(`❤️ <b>${j.nombre}</b>: ${diferencia > 0 ? '+' : ''}${diferencia} vida (Total: ${j.vida})`);
                if(j.vida === 0 && j.eliminado) addLog(`💀 <b>${j.nombre}</b> ha sido derrotado.`);
            }
            guardar();
            renderizarArena(); 
        }

        function cambiarVeneno(id, cant) {
            const j = jugadores.find(x => x.id === id);
            if (!j || j.eliminado) return;
            j.veneno += cant; if (j.veneno < 0) j.veneno = 0;
            addLog(`🤢 <b>${j.nombre}</b> veneno: ${j.veneno}/10`);
            if (j.veneno >= 10) { j.veneno = 10; j.eliminado = true; j.vida = 0; addLog(`💀 <b>${j.nombre}</b> muere por veneno.`); }
            guardar(); renderizarArena();
        }

        function serMonarca(id) {
            const j = jugadores.find(x => x.id === id);
            jugadores.forEach(jug => jug.monarca = false);
            j.monarca = true;
            addLog(`👑 <b>${j.nombre}</b> es el Monarca.`);
            guardar(); renderizarArena();
        }

        function cambiarTax(id) {
            const j = jugadores.find(x => x.id === id);
            j.tax += 2; addLog(`📜 <b>${j.nombre}</b> Tax: +${j.tax}`);
            guardar(); renderizarArena();
        }

        function cambiarCmdDmg(victimaId, agresorId, cant) {
            const v = jugadores.find(j => j.id === victimaId);
            const a = jugadores.find(j => j.id === agresorId);
            if (!v || v.eliminado) return;
            if (!v.cmdDmg[agresorId]) v.cmdDmg[agresorId] = 0;
            v.cmdDmg[agresorId] += cant;
            if (cant > 0) { v.vida -= cant; animarDanyo(victimaId); }
            if (v.cmdDmg[agresorId] >= 21) { v.eliminado = true; addLog(`💀 <b>${v.nombre}</b> muere por daño de comandante de <b>${a.nombre}</b>`); }
            guardar(); renderizarArena();
        }

        function animarDanyo(id) {
            const card = document.getElementById(`card-${id}`);
            if(card) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
        }

        function actualizarInterfazVida(id) {
            const j = jugadores.find(x => x.id === id);
            const card = document.getElementById(`card-${id}`);
            if (card) card.querySelector('.vida-numero').innerText = j.vida;
        }

        function guardar() { localStorage.setItem('mtg_players', JSON.stringify(jugadores)); }
        function quitarJugador(id) { jugadores = jugadores.filter(j => j.id !== id); guardar(); renderizarArena(); }

        function renderizarArena() {
            const arena = document.getElementById('arena');
            arena.innerHTML = "";
            const vivos = jugadores.filter(j => !j.eliminado);

            jugadores.forEach(j => {
                const esGanador = vivos.length === 1 && !j.eliminado && jugadores.length > 1;
                let cmdHTML = "";
                jugadores.forEach(op => {
                    if (op.id !== j.id) {
                        const pts = j.cmdDmg[op.id] || 0;
                        cmdHTML += `<div class="commander-row"><span style="font-size:0.65rem">${op.nombre}:</span><div style="display:flex; gap:5px;"><button onclick="cambiarCmdDmg(${j.id}, ${op.id}, -1)">-</button><span>${pts}/21</span><button onclick="cambiarCmdDmg(${j.id}, ${op.id}, 1)">+</button></div></div>`;
                    }
                });

                const card = document.createElement('div');
                card.className = `jugador-card ${j.eliminado ? 'eliminado' : ''} ${esGanador ? 'ganador' : ''} ${j.monarca ? 'has-monarch' : ''}`;
                card.id = `card-${j.id}`;
                if(j.foto) card.style.background = `url('${j.foto}')`;

                card.innerHTML = `
                    <button class="btn-remove-player" onclick="quitarJugador(${j.id})">✕</button>
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; padding-right:35px;">
                        <div>
                            <h3 style="margin:0;">${j.nombre}</h3>
                            <small style="color:var(--gold);">${j.comandante}</small>
                            <span class="tax-badge" onclick="cambiarTax(${j.id})">+${j.tax} Tax</span>
                        </div>
                        <button class="btn-monarch ${j.monarca ? 'active' : ''}" onclick="serMonarca(${j.id})">
                            ${j.monarca ? '👑 MONARCA' : 'CORONA'}
                        </button>
                    </div>
                    <span class="vida-numero">${j.vida}</span>
                    <div class="controles-vida">
                        <button class="btn-vida" style="background:var(--danger)" onmousedown="iniciarCambio(${j.id},-1)" onmouseup="detenerCambio(${j.id})" onmouseleave="detenerCambio(${j.id})">-</button>
                        <button class="btn-vida" style="background:var(--green)" onmousedown="iniciarCambio(${j.id},1)" onmouseup="detenerCambio(${j.id})" onmouseleave="detenerCambio(${j.id})">+</button>
                    </div>
                    <div class="extra-trackers">
                        <div class="tracker-box">
                            <span class="tracker-label">VENENO</span>
                            <div style="display:flex; align-items:center;">
                                <button class="veneno-btn" onclick="cambiarVeneno(${j.id},-1)">-</button>
                                <span style="color:#00ff00; font-weight:bold;">${j.veneno}/10</span>
                                <button class="veneno-btn" onclick="cambiarVeneno(${j.id},1)">+</button>
                            </div>
                        </div>
                    </div>
                    <div class="commander-section">
                        <span style="color:var(--gold); font-size:0.6rem; font-weight:bold; display:block; margin-bottom:5px;">⚔️ DAÑO COMANDANTE</span>
                        ${cmdHTML || '<small>Solo...</small>'}
                    </div>
                    <div class="status-area">${j.eliminado ? '<span class="eliminado-tag">💀 DERROTADO</span>' : ''} ${esGanador ? '<span class="ganador-tag">🏆 VICTORIA</span>' : ''}</div>`;
                arena.appendChild(card);
            });
        }

        function reiniciarPartida() {
            const vIni = parseInt(document.getElementById('vidasIniciales').value);
            jugadores.forEach(j => { 
                j.vida = vIni; 
                j.veneno = 0; 
                j.monarca = false; 
                j.tax = 0; 
                j.eliminado = false; 
                j.cmdDmg = {}; 
            });
            logPartida = []; 
            addLog(`--- Reinicio a ${vIni} vidas ---`);
            guardar(); 
            renderizarArena();
        }

        function borrarTodo() { if(confirm("¿Borrar todo?")) { jugadores = []; logPartida = []; localStorage.clear(); renderizarArena(); renderLog(); } }
        window.onload = () => { renderizarArena(); renderLog(); };
    </script>
</body>
</html>
