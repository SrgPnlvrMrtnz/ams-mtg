<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scryfall Deck Builder PRO</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
            <h1>Scryfall Magic PRO</h1>
            <button onclick="window.location.href='partida.html'" style="background: var(--danger);">⚔️ Modo Partida</button>
        </div>
        
        <div class="search-bar">
            <input type="text" id="texto" placeholder="Nombre de la carta...">
            <button id="buscardCarta">Buscar</button>
            <button id="generarCarta">Random</button>
        </div>

        <div class="mana-filter">
            <button class="mana-btn" data-color="w" title="Blanco">☀️</button>
            <button class="mana-btn" data-color="u" title="Azul">💧</button>
            <button class="mana-btn" data-color="b" title="Negro">💀</button>
            <button class="mana-btn" data-color="r" title="Rojo">🔥</button>
            <button class="mana-btn" data-color="g" title="Verde">🌳</button>
            <button id="clearFilters" title="Limpiar Filtros">🚫</button>
        </div>
    </header>

    <main class="main-layout">
        <aside class="side-panel left">
            <h3>⭐ Favoritos</h3>
            <ul id="listaFavoritos"></ul>
            <hr>
            <h3>Navegación</h3>
            <p>Página: <span id="numPagina">1</span></p>
            <div class="nav-buttons">
                <button type="button" id="anterior">←</button>
                <button type="button" id="siguiente">→</button>
            </div>
        </aside>

        <section class="contenedor-wrapper">
            <div id="status-msg-container">
                <div id="loader" class="hidden">
                    <div class="spinner"></div>
                    <p id="status-msg">Invocando grimorio...</p>
                </div>
            </div>
            <section class="contenedor" id="contenedor"></section>
        </section>

        <aside class="side-panel right">
            <h3>🗃️ Mis Mazos</h3>
            <div class="deck-controls">
                <input type="text" id="nuevoMazoNombre" placeholder="Nombre del mazo...">
                <button id="crearMazo">Crear</button>
            </div>
            <select id="selectorMazos"></select>
            <div id="contenidoMazo">
                <ul id="listaCartasMazo"></ul>
            </div>
        </aside>
    </main>

    <script src="api.js"></script>
</body>
</html>
